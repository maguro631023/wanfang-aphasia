<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>語圖 — 失語症溝通與練習</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2233">
<!-- iOS 的「加到主畫面」不讀 manifest 的 icons，必須另外指定 -->
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="語圖">
<style>
/* ============================================================
   設計代幣
   臨床用途優先：純白底、高對比、無裝飾。
   navy/teal 沿用 wanfang-* 系列的一致視覺。
   ============================================================ */
:root{
  --ink:        #0F2233;
  --ink-soft:   #4A5C6A;
  --paper:      #FFFFFF;
  --surface:    #EBF0F2;
  --surface-2:  #DCE5E8;
  --teal:       #0B6E6B;
  --teal-dark:  #095452;
  --amber:      #B45309;
  --line:       #B9C7CE;
  --focus:      #1D4ED8;

  --step: 1;              /* 字級倍率，由設定調整 */
  --tile-min: 148px;
  --radius: 10px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; }
body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:calc(17px * var(--step));
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button{ font-family:inherit; font-size:inherit; cursor:pointer; }

:focus-visible{
  outline:4px solid var(--focus);
  outline-offset:3px;
}

/* ---------- 版面骨架 ---------- */
.app{
  max-width:1080px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
  background:var(--paper);
  box-shadow:0 0 0 1px var(--line);
}

.topbar{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  background:var(--ink); color:#fff;
  position:sticky; top:0; z-index:20;
}
.brand{
  font-size:calc(19px * var(--step)); font-weight:800; letter-spacing:.06em;
  margin-right:auto;
}
.brand small{
  display:block; font-size:calc(11px * var(--step)); font-weight:400;
  letter-spacing:.02em; opacity:.72;
}

.modeswitch{ display:flex; background:rgba(255,255,255,.14); border-radius:999px; padding:3px; }
.modeswitch button{
  border:0; background:transparent; color:#fff;
  padding:9px 18px; border-radius:999px; font-weight:700;
  min-height:44px;
}
.modeswitch button[aria-pressed="true"]{ background:var(--teal); }

.iconbtn{
  border:0; background:rgba(255,255,255,.14); color:#fff;
  width:46px; height:46px; border-radius:10px; font-size:20px;
  display:grid; place-items:center;
}

main{ flex:1; padding:18px 14px 28px; }

/* ---------- 導覽列（永遠可見的返回） ---------- */
.navrow{
  display:flex; align-items:center; gap:12px;
  margin-bottom:16px; min-height:56px;
}
body[data-hand="left"] .navrow{ flex-direction:row; }
body[data-hand="right"] .navrow{ flex-direction:row-reverse; }

.backbtn{
  border:2px solid var(--line); background:var(--surface);
  color:var(--ink); font-weight:700;
  padding:12px 20px; border-radius:var(--radius); min-height:56px;
  display:inline-flex; align-items:center; gap:8px;
}
.backbtn:hover{ background:var(--surface-2); }
.backbtn[hidden]{ display:none; }

.crumb{
  font-size:calc(20px * var(--step)); font-weight:800;
  flex:1;
}
/* 只有在返回鍵存在時標題才靠右，否則第一層的標題會孤立在右上角 */
body[data-hand="right"] .navrow:has(.backbtn:not([hidden])) .crumb{ text-align:right; }

/* ---------- 角色選擇列 ---------- */
.charrow{
  display:flex; gap:10px; flex-wrap:wrap;
  padding-bottom:16px; margin-bottom:16px;
  border-bottom:2px solid var(--surface-2);
}
.chip{
  display:flex; align-items:center; gap:9px;
  border:2px solid var(--line); background:var(--paper);
  border-radius:999px; padding:6px 16px 6px 6px; min-height:56px;
  font-weight:700; color:var(--ink-soft);
}
.chip .avatar{
  width:42px; height:42px; border-radius:50%; overflow:hidden;
  background:var(--surface); display:grid; place-items:center; flex:0 0 auto;
}
.chip .avatar img{ width:100%; height:100%; object-fit:cover; }
.chip .avatar .ph{ font-size:calc(19px * var(--step)); font-weight:800; color:var(--teal-dark); }
.chip.on{ border-color:var(--teal); background:#EAF4F3; color:var(--ink); }
.chip:hover{ border-color:var(--teal); }

/* ---------- 格狀選單 ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));
  gap:14px;
}

.tile{
  border:2px solid var(--line); background:var(--paper);
  border-radius:var(--radius); padding:0; overflow:hidden;
  min-height:172px;
  display:flex; flex-direction:column;
  transition:transform .08s ease, border-color .12s ease;
}
.tile:hover{ border-color:var(--teal); }
.tile:active{ transform:scale(.97); }

.tile .art{
  flex:1; display:grid; place-items:center;
  background:var(--surface); min-height:104px;
}
.tile .art img{ width:100%; height:100%; object-fit:cover; display:block; }
.tile .art .ph{
  font-size:calc(40px * var(--step)); font-weight:800; color:var(--teal-dark);
  letter-spacing:.04em;
}
.tile .label{
  padding:11px 8px; font-size:calc(19px * var(--step)); font-weight:700;
  border-top:2px solid var(--line);
}
body[data-text="off"] .tile .label{ display:none; }
body[data-text="off"] .tile{ min-height:150px; }

.tile.cat .art{ background:var(--ink); }
.tile.cat .art .ph{ color:#fff; }

/* ---------- 購物清單 ---------- */
.tile-wrap{ position:relative; display:flex; }
.tile-wrap > .tile{ flex:1; }

.addbtn{
  position:absolute; top:8px; right:8px; z-index:2;
  width:58px; height:58px; border-radius:12px;
  border:2px solid var(--teal); background:rgba(255,255,255,.94);
  color:var(--teal-dark); font-size:calc(30px * var(--step)); font-weight:800;
  display:grid; place-items:center; line-height:1;
}
.addbtn:hover{ background:var(--teal); color:#fff; }

.qtytag{
  position:absolute; top:8px; left:8px; z-index:2;
  min-width:44px; height:44px; padding:0 10px; border-radius:22px;
  background:var(--amber); color:#fff;
  font-size:calc(20px * var(--step)); font-weight:800;
  display:grid; place-items:center;
}

.cartbtn{ position:relative; }
.iconbtn[hidden]{ display:none; }
.cartbtn .count[hidden]{ display:none; }
.cartbtn .count{
  position:absolute; top:-6px; right:-6px;
  min-width:24px; height:24px; padding:0 6px; border-radius:12px;
  background:var(--amber); color:#fff;
  font-size:13px; font-weight:800; display:grid; place-items:center;
}

.cartlist{ max-width:640px; margin:0 auto; }
.cartrow{
  display:flex; align-items:center; gap:14px;
  border:2px solid var(--line); border-radius:var(--radius);
  padding:10px 12px; margin-bottom:12px; background:var(--paper);
}
.cartrow .thumb{
  width:74px; height:74px; flex:0 0 auto; border-radius:8px;
  overflow:hidden; background:var(--surface); display:grid; place-items:center;
}
.cartrow .thumb img{ width:100%; height:100%; object-fit:cover; }
.cartrow .thumb .ph{ font-size:calc(17px * var(--step)); font-weight:800; color:var(--teal-dark); }
.cartrow .cname2{ flex:1; font-size:calc(21px * var(--step)); font-weight:800; }

.stepper{ display:flex; align-items:center; gap:8px; }
.stepper button{
  width:54px; height:54px; border-radius:10px;
  border:2px solid var(--line); background:var(--surface);
  font-size:calc(26px * var(--step)); font-weight:800; line-height:1;
}
.stepper button:disabled{ opacity:.35; }
.stepper button.rm{
  border-color:var(--amber); color:var(--amber);
  background:var(--paper); width:64px;
}

/* 強度型項目（身體不適）：1–5 直接點選，像疼痛量表 */
.cartrow.scale{ display:block; }
.cartrow.scale .rowtop{ display:flex; align-items:center; gap:14px; }
.cartrow.scale .rm{
  width:60px; height:60px; border-radius:10px; flex:0 0 auto;
  border:2px solid var(--amber); background:var(--paper); color:var(--amber);
  font-size:calc(24px * var(--step)); font-weight:800;
}
.scalerow{ display:flex; gap:8px; margin-top:12px; }
.scalerow .lv{
  flex:1; height:62px; border-radius:10px;
  border:2px solid var(--line); background:var(--surface);
  font-size:calc(22px * var(--step)); font-weight:800; color:var(--ink-soft);
}
.scalerow .lv.on{ background:var(--amber); border-color:var(--amber); color:#fff; }
.scalelabel{
  margin-top:10px; text-align:center; font-weight:800;
  font-size:calc(22px * var(--step)); color:var(--amber);
}
.stepper .qty{
  min-width:78px; text-align:center;
  font-size:calc(26px * var(--step)); font-weight:800;
}
.stepper .qty small{
  display:block; font-size:calc(15px * var(--step)); color:var(--amber);
  letter-spacing:.14em; line-height:1.1;
}

.emptycart{ text-align:center; color:var(--ink-soft); padding:40px 0; font-size:calc(20px * var(--step)); }

/* ---------- 說出後的確認 ---------- */
.said{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--ink); color:#fff;
  padding:16px 30px; border-radius:14px;
  font-size:calc(26px * var(--step)); font-weight:800;
  box-shadow:0 10px 30px rgba(15,34,51,.34);
  z-index:40; max-width:90vw; text-align:center;
}
.said[hidden]{ display:none; }

/* ---------- 練習模式 ---------- */
.practice{ max-width:640px; margin:0 auto; }

.stimulus{
  border:2px solid var(--line); border-radius:var(--radius);
  background:var(--surface); overflow:hidden;
  aspect-ratio:4/3; display:grid; place-items:center; margin-bottom:18px;
}
.stimulus img{ width:100%; height:100%; object-fit:cover; }
.stimulus .ph{ font-size:calc(76px * var(--step)); font-weight:800; color:var(--teal-dark); }

.ask{
  text-align:center; font-size:calc(22px * var(--step)); font-weight:700;
  margin:0 0 18px;
}

.answers{ display:grid; gap:12px; }
.bigbtn{
  border:2px solid transparent; border-radius:var(--radius);
  padding:18px 20px; min-height:64px; font-weight:800;
  font-size:calc(20px * var(--step));
}
.bigbtn.ok{ background:var(--teal); color:#fff; }
.bigbtn.ok:hover{ background:var(--teal-dark); }
.bigbtn.help{ background:var(--paper); color:var(--amber); border-color:var(--amber); }
.bigbtn.help:hover{ background:#FFF7ED; }
.bigbtn.ghost{ background:var(--surface); color:var(--ink); border-color:var(--line); }

/* 提示階梯 —— 這是本頁的核心結構，層級本身就是資訊 */
.ladder{ margin-top:20px; border-left:5px solid var(--surface-2); padding-left:0; }
.rung{
  border:2px solid var(--line); border-left:0;
  background:var(--paper); margin-bottom:10px;
  border-radius:0 var(--radius) var(--radius) 0;
  overflow:hidden;
}
.rung[data-reached="true"]{ border-color:var(--amber); }
.rung > .rung-head{
  width:100%; text-align:left; border:0; background:transparent;
  padding:15px 16px; min-height:60px;
  display:flex; align-items:center; gap:14px; font-weight:700;
}
.rung .num{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  background:var(--surface-2); color:var(--ink);
  display:grid; place-items:center; font-size:calc(15px * var(--step)); font-weight:800;
}
.rung[data-reached="true"] .num{ background:var(--amber); color:#fff; }
.rung-body{ padding:0 16px 16px; }
.rung-body[hidden]{ display:none; }

.cuelist{ list-style:none; margin:0; padding:0; display:grid; gap:9px; }
.cuelist li{
  background:var(--surface); border-radius:8px; padding:13px 15px;
  font-size:calc(19px * var(--step));
}
.phon{
  font-size:calc(44px * var(--step)); font-weight:800; color:var(--teal-dark);
  text-align:center; padding:14px 0; letter-spacing:.08em;
}
.phon small{ display:block; font-size:calc(14px * var(--step)); color:var(--ink-soft); font-weight:500; letter-spacing:0; }
.reveal{
  font-size:calc(46px * var(--step)); font-weight:800; text-align:center;
  padding:10px 0 16px;
}

/* ---------- 結果 ---------- */
.summary{ max-width:640px; margin:0 auto; }
.sumrow{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  border-bottom:1px solid var(--line); padding:13px 2px;
  font-size:calc(19px * var(--step));
}
.pill{
  font-size:calc(14px * var(--step)); font-weight:800;
  padding:5px 12px; border-radius:999px; white-space:nowrap;
}
.lv0{ background:#D6F0E4; color:#0A5B3C; }
.lv1{ background:#FDECC8; color:#7C4A00; }
.lv2{ background:#FBD9B5; color:#7C3300; }
.lv3{ background:#F3D2D2; color:#7C1F1F; }

/* ---------- 設定 ---------- */
dialog{
  border:0; border-radius:14px; padding:0; width:min(440px,92vw);
  box-shadow:0 24px 60px rgba(15,34,51,.3);
}
dialog::backdrop{ background:rgba(15,34,51,.5); }
.dlg-head{ background:var(--ink); color:#fff; padding:16px 20px; font-weight:800; font-size:calc(19px * var(--step)); }
.dlg-body{ padding:18px 20px 22px; display:grid; gap:20px; }
.field > span{ display:block; font-weight:700; margin-bottom:9px; }
.seg{ display:flex; gap:8px; }
.seg button{
  flex:1; border:2px solid var(--line); background:var(--paper);
  padding:13px 8px; border-radius:9px; font-weight:700; min-height:52px;
}
.seg button[aria-pressed="true"]{ background:var(--teal); color:#fff; border-color:var(--teal); }

footer{
  padding:16px 14px 26px; text-align:center;
  color:var(--ink-soft); font-size:calc(13px * var(--step)); line-height:1.6;
  border-top:1px solid var(--line);
}
.notice{ font-weight:700; color:var(--amber); }

@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body data-hand="right" data-text="on">

<div class="app">
  <header class="topbar">
    <div class="brand">語圖<small>失語症溝通與練習・研發測試版</small></div>
    <div class="modeswitch" role="group" aria-label="模式">
      <button id="mComm"  aria-pressed="true">溝通</button>
      <button id="mPrac"  aria-pressed="false">練習</button>
    </div>
    <button class="iconbtn cartbtn" id="btnCart" aria-label="購物清單">🛒<span class="count" id="cartCount" hidden>0</span></button>
    <button class="iconbtn" id="btnSet" aria-label="設定">⚙</button>
  </header>

  <main>
    <div class="navrow">
      <button class="backbtn" id="btnBack" hidden>← 回上一頁</button>
      <div class="crumb" id="crumb">請選擇</div>
    </div>
    <div id="view"></div>
  </main>

  <footer>
    <span class="notice">研發測試中，非醫療器材</span><br>
    本程式不進行診斷，亦不提供個別化醫療建議。所有使用紀錄僅存放於本機裝置，不會上傳。
  </footer>
</div>

<div class="said" id="said" hidden aria-live="polite"></div>

<dialog id="dlg">
  <div class="dlg-head">設定</div>
  <div class="dlg-body">
    <label class="field">
      <span>文字標籤</span>
      <div class="seg" data-set="text">
        <button data-v="on"  aria-pressed="true">顯示文字</button>
        <button data-v="off" aria-pressed="false">只看圖片</button>
      </div>
    </label>
    <label class="field">
      <span>操作慣用手</span>
      <div class="seg" data-set="hand">
        <button data-v="left"  aria-pressed="false">左手</button>
        <button data-v="right" aria-pressed="true">右手</button>
      </div>
    </label>
    <label class="field">
      <span>字級</span>
      <div class="seg" data-set="step">
        <button data-v="1"    aria-pressed="true">標準</button>
        <button data-v="1.15" aria-pressed="false">大</button>
        <button data-v="1.32" aria-pressed="false">特大</button>
      </div>
    </label>
    <button class="bigbtn ghost" id="btnTest">測試語音</button>
    <p id="voiceInfo" style="margin:-8px 0 0; font-size:calc(14px * var(--step)); color:var(--ink-soft)"></p>
    <button class="bigbtn ghost" id="btnExport">匯出練習紀錄（JSON）</button>
    <button class="bigbtn ok" id="btnClose">完成</button>
  </div>
</dialog>

<script>
/* ============================================================
   1. 詞庫核心 —— 溝通模式與練習模式共用同一份資料
   ------------------------------------------------------------
   欄位說明：
     practice        是否納入命名練習（名詞為主；需求詞與動作先設 false）
     semantic_cues   SFA 式語意提示，順序＝用途／外觀／類別／地點／關聯
     phon_zhuyin     音韻提示載體【暫用注音首音，Phase 0 前導測試後可能改為
                     聲旁或口型影片，改這個欄位即可，不必動介面】
     name_agreement / aoa / familiarity / imageability / frequency
                     心理語言學常模，先留 null，取得後補
   資產約定：
     圖片 assets/img/{id}.webp   語音 assets/audio/{id}.mp3
     檔案不存在時自動退回文字佔位圖與系統語音合成
   ============================================================ */
const CATEGORIES = [
  { id:"daily",  name:"日常用品", glyph:"物" },
  { id:"food",   name:"食物飲料", glyph:"食" },
  { id:"body",   name:"身體不適", glyph:"體" },
  { id:"people", name:"家人醫護", glyph:"人" },
  { id:"act",    name:"我想要",   glyph:"要" }
];

const LEXICON = [
  { id:"toothbrush", cat:"daily", zh:"牙刷", zhuyin:"ㄧㄚˊ ㄕㄨㄚ", phon_zhuyin:"ㄧ", practice:true,
    semantic_cues:["用來刷牙齒","細細長長的，前面有毛","日常用品","放在浴室","跟牙膏一起用"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },
  { id:"glasses", cat:"daily", zh:"眼鏡", zhuyin:"ㄧㄢˇ ㄐㄧㄥˋ", phon_zhuyin:"ㄧ", practice:true,
    semantic_cues:["用來看清楚東西","有兩片鏡片和鏡架","日常用品","戴在臉上","跟眼睛有關"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },
  { id:"towel", cat:"daily", zh:"毛巾", zhuyin:"ㄇㄠˊ ㄐㄧㄣ", phon_zhuyin:"ㄇ", practice:true,
    semantic_cues:["用來擦乾身體","軟軟的、方形的布","日常用品","放在浴室","洗完澡會用到"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },
  { id:"television", cat:"daily", zh:"電視", zhuyin:"ㄉㄧㄢˋ ㄕˋ", phon_zhuyin:"ㄉ", practice:true,
    semantic_cues:["用來看節目","方形的大螢幕","電器","放在客廳","要用遙控器打開"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },

  { id:"water", cat:"food", zh:"水", zhuyin:"ㄕㄨㄟˇ", phon_zhuyin:"ㄕ", practice:true,
    semantic_cues:["用來喝的","透明沒有顏色","飲料","裝在杯子裡","口渴的時候要喝"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },
  { id:"rice", cat:"food", zh:"飯", zhuyin:"ㄈㄢˋ", phon_zhuyin:"ㄈ", practice:true,
    semantic_cues:["用來吃的","白色的一粒一粒","主食","裝在碗裡","配菜一起吃"],
    name_agreement:null, aoa:null, familiarity:null, imageability:null, frequency:null, is_personal:false },
  { id:"noodles", cat:"food", zh:"麵", zhuyin:"ㄇㄧㄢˋ", phon_zhuyin:"ㄇ", practice:true,
    semantic_cues:["用來吃的","長長條條的","主食","裝在碗裡","用筷子夾起來吃"],

const byId  = id => LEXICON.find(w => w.id === id);
const byCat = c  => LEXICON.filter(w => w.cat === c);

/* ------------------------------------------------------------
   config.json：控制類別與詞條的「顯示與否」和「排列順序」
   - 陣列順序即畫面順序
   - enabled:false 隱藏，但保留設定方便日後開回來
   - config 沒列到的項目排在最後（新增詞條時不必同步改 config）
   - 檔案缺失或格式錯誤時，退回程式內的預設順序，不會整個壞掉
   ------------------------------------------------------------ */
let CONFIG = null;

function orderMaps(list){
  const rank = new Map(), on = new Map();
  (Array.isArray(list) ? list : []).forEach((x, i) => {
    if (!x || !x.id) return;
    rank.set(x.id, i);
    on.set(x.id, x.enabled !== false);
  });
  return { rank, on };
}

function visibleCategories(){
  if (!CONFIG || !Array.isArray(CONFIG.categories)) return CATEGORIES;
  const { rank, on } = orderMaps(CONFIG.categories);
  return CATEGORIES
    .filter(c => on.get(c.id) !== false)
    .slice()
    .sort((a, b) => (rank.has(a.id) ? rank.get(a.id) : 999)
                  - (rank.has(b.id) ? rank.get(b.id) : 999));
}

function visibleWords(catId){
  const base = LEXICON.filter(w => w.cat === catId);
  if (!CONFIG || !Array.isArray(CONFIG.words)) return base;
  const { rank, on } = orderMaps(CONFIG.words);
  return base
    .filter(w => on.get(w.id) !== false)
    .slice()
    .sort((a, b) => (rank.has(a.id) ? rank.get(a.id) : 999)
                  - (rank.has(b.id) ? rank.get(b.id) : 999));
}

/* 中文量詞：唸出清單時要用對，不能一律說「個」。
   沒列到的詞退回「個」。 */
const CLASSIFIER = {
  toothbrush:"支", glasses:"副", towel:"條", television:"台",
  water:"杯", rice:"碗", noodles:"碗", medicine:"包",
  wife:"位", son:"位", daughter:"位", doctor:"位"
};
const clsOf = w => CLASSIFIER[w.id] || "個";

/* 可計數的類別。頭痛、上廁所這類詞沒有數量的概念，
   預設不給加入清單；要開放請在 config.json 的 cart.categories 調整。 */
function cartCategories(){
  const c = CONFIG && CONFIG.cart;
  return (c && Array.isArray(c.categories)) ? c.categories : ["daily","food"];
}
function cartEnabled(){
  const c = CONFIG && CONFIG.cart;
  return !c || c.enabled !== false;
}
function cartMax(){
  const c = CONFIG && CONFIG.cart;
  const n = c && Number(c.max);
  return (n >= 1 && n <= 9) ? n : 5;
}
function isCountable(w){
  return cartEnabled() && cartCategories().includes(w.cat);
}
/* 只能是 1 的類別：像「上廁所」「頭痛」沒有數量的概念，
   可以加入清單但不給增減，清單裡也不唸出數量與量詞。 */
function cartSingleCats(){
  const c = CONFIG && CONFIG.cart;
  return (c && Array.isArray(c.single)) ? c.single : ["act", "body"];
}
function isSingle(w){
  return cartSingleCats().includes(w.cat) && !isScale(w);
}
/* 強度類別：數字代表程度而非數量（身體不適）。
   唸出時用副詞而不是數字——「非常頭痛」比「頭痛 5」好懂得多。 */
function cartScaleCats(){
  const c = CONFIG && CONFIG.cart;
  return (c && Array.isArray(c.scale)) ? c.scale : ["body"];
}
function isScale(w){
  return cartScaleCats().includes(w.cat);
}
const INTENSITY = ["", "有一點點", "有一點", "", "很", "非常"];
const intensityText = (w, n) => `${INTENSITY[n] || ""}${w.zh}`;

let cart = {};              // 實際內容在 store 建立後才載入（見下方 §2）
let cartOpen = false;

function cartTotal(){
  return Object.values(cart).reduce((a, b) => a + b, 0);
}
function setQty(id, n){
  const w = byId(id);
  const cap = (w && isSingle(w)) ? 1 : ((w && isScale(w)) ? 5 : cartMax());
  n = Math.max(0, Math.min(cap, n));
  if (n === 0) delete cart[id]; else cart[id] = n;
  store.set("cart", cart);
  paintCartCount();
}
function paintCartCount(){
  const el = document.getElementById("cartCount");
  const n = cartTotal();
  el.textContent = n;
  el.hidden = n === 0;
}

async function loadConfig(){
  try {
    if (typeof fetch !== "function") return;
    const r = await fetch("config.json", { cache:"no-cache" });
    if (r.ok) CONFIG = await r.json();
  } catch(e){
    CONFIG = null;   // 靜默退回預設，不打擾使用者
  }
}

/* ============================================================
   2. 本機儲存 —— 絕不外傳。localStorage 不可用時退回記憶體。
   ============================================================ */
const store = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){ ok = false; }
  return {
    get(k, d){
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch(e){ return d; }
    },
    set(k, v){
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){ mem[k] = s; }
    }
  };
})();

cart = store.get("cart", {});   // store 已就緒，載入上次未清空的清單

/* ============================================================
   3. 語音輸出
   ------------------------------------------------------------
   行動裝置的兩個限制，都必須在這裡處理：
   (1) 語音合成只能在「使用者手勢的同步流程」中觸發。若先試播 mp3、
       等 Promise 失敗再退回合成，就已經脫離手勢，iOS／Android 會
       靜默擋掉（不報錯、就是沒聲音）。所以改成先查表再決定，
       全程同步。
   (2) iOS 需要在一次真實手勢中先呼叫過 speechSynthesis 才會啟用，
       因此第一次觸控時送一個靜音 utterance 解鎖。
   ============================================================ */
const audioAvail = Object.create(null);   // id -> true/false，啟動時探測
let   voicesReady = false;
let   unlocked = false;

function pickVoice(){
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v => v.lang === "zh-TW")
      || vs.find(v => v.lang && v.lang.replace("_","-").startsWith("zh"))
      || null;
}

if ("speechSynthesis" in window){
  const mark = () => { voicesReady = true; };
  speechSynthesis.addEventListener?.("voiceschanged", mark);
  if ((speechSynthesis.getVoices() || []).length) mark();
}

/* 第一次觸控時解鎖，之後移除監聽 */
function unlock(){
  if (unlocked) return;
  unlocked = true;
  if ("speechSynthesis" in window){
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    try { speechSynthesis.speak(u); } catch(e){}
  }
}
["pointerdown","touchstart","click"].forEach(ev =>
  document.addEventListener(ev, unlock, { once:true, capture:true }));

/* 啟動時探測哪些詞有預錄音檔；查不到就一律走語音合成 */
(function probeAudio(){
  LEXICON.forEach(w => { audioAvail[w.id] = false; });
  if (typeof fetch !== "function") return;   // 環境不支援就一律走語音合成
  LEXICON.forEach(w => {
    try {
      fetch(`assets/audio/${w.cat}/${w.id}.mp3`, { method:"HEAD" })
        .then(r => { audioAvail[w.id] = r.ok; })
        .catch(() => {});
    } catch(e){ /* 探測失敗不影響主流程 */ }
  });
})();

/* queue=true 時不清掉待唸佇列，讓多筆依序唸完（唸整份清單用）。
   單筆點選則維持插隊，避免連點時聲音疊在一起。 */
function tts(word, queue){
  if (!("speechSynthesis" in window)) return false;
  try {
    if (!queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word.zh);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = "zh-TW";
    u.rate = 0.85;
    speechSynthesis.speak(u);
    return true;
  } catch(e){ return false; }
}

function speak(word){
  flash(word.zh);
  unlock();
  if (audioAvail[word.id]){
    const a = new Audio(`assets/audio/${word.cat}/${word.id}.mp3`);
    a.play().catch(() => tts(word));   // 檔案在但播不動時的最後保險
  } else {
    tts(word);                          // 同步呼叫，維持在手勢流程內
  }
}

let flashTimer = null;
function flash(text){
  const el = document.getElementById("said");
  el.textContent = "🔊 " + text;
  el.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.hidden = true; }, 2600);  // 僅為提示殘留，不影響任何操作
}

   4. 圖片：檔案存在就用，不存在退回文字佔位圖
   ============================================================ */
/* ============================================================
   4. 角色與圖片
   ------------------------------------------------------------
   詞條圖檔：  assets/img/{類別}/{詞條id}.webp
   詞條音檔：  assets/audio/{類別}/{詞條id}.mp3
   角色類別圖：assets/img/WF-{角色}-{類別}.webp
   頭像（選用）：assets/img/WF-{角色}.webp
   退回順序：角色圖 → 無角色的 cat-{類別}.webp → 文字佔位
   詞條圖（n001…）不分角色，維持中性。
   ============================================================ */
const CHARACTERS = [
  { id:"cat",  name:"萬小貓" },
  { id:"dog",  name:"萬大狗" },
  { id:"boy",  name:"萬小廷" },
  { id:"girl", name:"萬小芳" }
];

let charId = store.get("character", "cat");
if (!CHARACTERS.some(c => c.id === charId)) charId = "cat";

/* 依序試 data-chain 裡的候選路徑，全部失敗才換成文字 */
function imgFallback(el){
  const chain = (el.dataset.chain || "").split("|").filter(Boolean);
  if (chain.length){
    el.dataset.chain = chain.slice(1).join("|");
    el.src = chain[0];
  } else {
    const s = document.createElement("span");
    s.className = "ph";
    s.textContent = el.dataset.glyph || "";
    el.replaceWith(s);
  }
}

function art(word){
  return `<div class="art">
    <img src="assets/img/${word.cat}/${word.id}.webp" alt=""
         data-glyph="${word.zh}" onerror="imgFallback(this)">
  </div>`;
}

function catArt(c){
  return `<div class="art">
    <img src="assets/img/WF-${charId}-${c.id}.webp" alt=""
         data-chain="assets/img/cat-${c.id}.webp"
         data-glyph="${c.glyph}" onerror="imgFallback(this)">
  </div>`;
}

/* 主畫面的角色選擇列 */
function charRow(){
  return `<div class="charrow" role="group" aria-label="選擇角色">
    ${CHARACTERS.map(ch => `
      <button class="chip${ch.id === charId ? " on" : ""}" data-char="${ch.id}"
              aria-pressed="${ch.id === charId}">
        <span class="avatar">
          <img src="assets/img/WF-${ch.id}.webp" alt=""
               data-chain="assets/img/WF-${ch.id}-daily.webp"
               data-glyph="${ch.name.slice(-1)}" onerror="imgFallback(this)">
        </span>
        <span class="cname">${ch.name}</span>
      </button>`).join("")}
  </div>`;
}

function bindCharRow(root){
  root.querySelectorAll("[data-char]").forEach(b => {
    b.onclick = () => {
      charId = b.dataset.char;
      store.set("character", charId);
      render();
    };
  });
}

/* ============================================================
   5. 畫面
   ============================================================ */
const view  = document.getElementById("view");
const crumb = document.getElementById("crumb");
const back  = document.getElementById("btnBack");

let mode = "comm";        // comm | prac
let stack = [];           // 導覽堆疊，深度最多 2 層
let session = null;       // 練習中的作答狀態

function render(){
  document.getElementById("btnCart").hidden = !(cartEnabled() && mode === "comm");
  paintCartCount();
  if (cartOpen){ back.hidden = false; renderCart(); return; }
  back.hidden = stack.length === 0;
  if (mode === "comm") renderComm(); else renderPrac();
}

/* ---------- 溝通模式 ---------- */
function renderComm(){
  if (stack.length === 0){
    crumb.textContent = "你想說什麼？";
    view.innerHTML = charRow() + `<div class="grid">${visibleCategories().map(c => `
      <button class="tile cat" data-cat="${c.id}">
        ${catArt(c)}
        <div class="label">${c.name}</div>
      </button>`).join("")}</div>`;
    bindCharRow(view);
    view.querySelectorAll("[data-cat]").forEach(b =>
      b.onclick = () => { stack.push(b.dataset.cat); render(); });
  } else {
    const cat = CATEGORIES.find(c => c.id === stack[0]);
    crumb.textContent = cat.name;
    view.innerHTML = `<div class="grid">${visibleWords(cat.id).map(w => {
      const q = cart[w.id] || 0;
      return `<div class="tile-wrap">
        <button class="tile" data-w="${w.id}">
          ${art(w)}
          <div class="label">${w.zh}</div>
        </button>
        ${isCountable(w)
          ? `<button class="addbtn${(isSingle(w) && q) ? " on" : ""}" data-add="${w.id}"
                     aria-label="${(isSingle(w) && q) ? "從清單移除" : "加入清單"}：${w.zh}"
                     aria-pressed="${isSingle(w) && q ? "true" : "false"}">${(isSingle(w) && q) ? "✓" : "＋"}</button>`
          : ""}
        ${(q && !isSingle(w)) ? `<span class="qtytag">${q}</span>` : ""}
      </div>`;
    }).join("")}</div>`;
    view.querySelectorAll("[data-w]").forEach(b =>
      b.onclick = () => speak(byId(b.dataset.w)));
    view.querySelectorAll("[data-add]").forEach(b =>
      b.onclick = () => {
        const w = byId(b.dataset.add);
        if (isSingle(w)){
          setQty(w.id, cart[w.id] ? 0 : 1);   // 再按一次就取消
        } else {
          setQty(w.id, (cart[w.id] || 0) + 1);
        }
        if (cart[w.id]) speak(w);
        render();
      });
  }
}

/* ---------- 購物清單 ---------- */
function renderCart(){
  crumb.textContent = "我的清單";
  const ids = Object.keys(cart).filter(id => byId(id));
  if (!ids.length){
    view.innerHTML = `<div class="emptycart">清單是空的<br>在物品上按「＋」就會加進來</div>`;
    return;
  }
  view.innerHTML = `<div class="cartlist">
    ${ids.map(id => {
      const w = byId(id), q = cart[id];
      if (isScale(w)){
        return `<div class="cartrow scale">
          <div class="rowtop">
            <span class="thumb">
              <img src="assets/img/${w.cat}/${w.id}.webp" alt=""
                   data-glyph="${w.zh}" onerror="imgFallback(this)">
            </span>
            <span class="cname2">${w.zh}</span>
            <button class="rm" data-dec0="${id}" aria-label="從清單移除：${w.zh}">✕</button>
          </div>
          <div class="scalerow" role="group" aria-label="${w.zh}的程度">
            ${[1,2,3,4,5].map(n => `
              <button class="lv${n <= q ? " on" : ""}" data-lv="${id}:${n}"
                      aria-pressed="${n === q}" aria-label="程度 ${n}">${n}</button>`).join("")}
          </div>
          <div class="scalelabel">${intensityText(w, q)}</div>
        </div>`;
      }
      return `<div class="cartrow">
        <span class="thumb">
          <img src="assets/img/${w.cat}/${w.id}.webp" alt=""
               data-glyph="${w.zh}" onerror="imgFallback(this)">
        </span>
        <span class="cname2">${w.zh}</span>
        ${isSingle(w)
          ? `<span class="stepper">
               <button class="rm" data-dec="${id}" aria-label="從清單移除：${w.zh}">✕</button>
             </span>`
          : `<span class="stepper">
               <button data-dec="${id}" aria-label="減少">−</button>
               <span class="qty">${q}${clsOf(w)}<small>${"●".repeat(q)}</small></span>
               <button data-inc="${id}" aria-label="增加" ${q >= cartMax() ? "disabled" : ""}>＋</button>
             </span>`}
      </div>`;
    }).join("")}
    <div style="height:12px"></div>
    <button class="bigbtn ok" id="cartSay">🔊 唸出整份清單</button>
    <div style="height:10px"></div>
    <button class="bigbtn ghost" id="cartClear">清空清單</button>
  </div>`;

  view.querySelectorAll("[data-inc]").forEach(b =>
    b.onclick = () => { setQty(b.dataset.inc, (cart[b.dataset.inc] || 0) + 1); render(); });
  view.querySelectorAll("[data-dec]").forEach(b =>
    b.onclick = () => { setQty(b.dataset.dec, (cart[b.dataset.dec] || 0) - 1); render(); });
  view.querySelectorAll("[data-dec0]").forEach(b =>
    b.onclick = () => { setQty(b.dataset.dec0, 0); render(); });
  view.querySelectorAll("[data-lv]").forEach(b =>
    b.onclick = () => {
      const [id, n] = b.dataset.lv.split(":");
      setQty(id, Number(n));
      const w = byId(id);
      speak({ id, cat:w.cat, zh: intensityText(w, Number(n)) });
      render();
    });

  view.querySelector("#cartSay").onclick = () => {
    unlock();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    ids.forEach((id, i) => {
      const w = byId(id);
      const text = isScale(w)  ? intensityText(w, cart[id])
                 : isSingle(w) ? w.zh
                 : `${w.zh} ${cart[id]}${clsOf(w)}`;
      tts({ zh: text }, i > 0);   // 第一筆插隊，其餘接在後面
    });
    flash("唸出清單");
  };
  view.querySelector("#cartClear").onclick = () => {
    cart = {}; store.set("cart", cart); paintCartCount(); render();
  };
}

/* ---------- 練習模式 ---------- */
function renderPrac(){
  if (stack.length === 0){
    crumb.textContent = "選擇練習主題";
    const cats = visibleCategories().filter(c => visibleWords(c.id).some(w => w.practice));
    view.innerHTML = `<div class="grid">${cats.map(c => {
      const n = visibleWords(c.id).filter(w => w.practice).length;
      return `<button class="tile cat" data-pc="${c.id}">
        ${catArt(c)}
        <div class="label">${c.name}<br><small style="font-weight:400">${n} 題</small></div>
      </button>`;
    }).join("")}</div>`;
    view.querySelectorAll("[data-pc]").forEach(b =>
      b.onclick = () => { startSession(b.dataset.pc); stack.push(b.dataset.pc); render(); });
    return;
  }
  if (session.i >= session.items.length){ renderSummary(); return; }
  renderTrial();
}

function startSession(catId){
  session = {
    cat: catId,
    started: new Date().toISOString(),
    items: visibleWords(catId).filter(w => w.practice).map(w => w.id),
    i: 0,
    level: 0,           // 本題已展開到第幾層提示
    results: []
  };
}

function renderTrial(){
  const w = byId(session.items[session.i]);
  crumb.textContent = `第 ${session.i + 1} / ${session.items.length} 題`;

  view.innerHTML = `
  <div class="practice">
    <div class="stimulus">
      <img src="assets/img/${w.cat}/${w.id}.webp" alt=""
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${w.zh}'}))">
    </div>
    <p class="ask">這是什麼？請說出來</p>
    <div class="answers">
      <button class="bigbtn ok"   id="pOK">我說對了</button>
      <button class="bigbtn help" id="pHelp">需要提示</button>
    </div>

    <div class="ladder" id="ladder" hidden>
      <div class="rung" data-lv="1">
        <button class="rung-head" data-open="1"><span class="num">1</span>語意提示</button>
        <div class="rung-body" hidden>
          <ul class="cuelist">${(w.semantic_cues || []).map(c => `<li>${c}</li>`).join("")}</ul>
        </div>
      </div>
      <div class="rung" data-lv="2">
        <button class="rung-head" data-open="2"><span class="num">2</span>音韻提示</button>
        <div class="rung-body" hidden>
          <div class="phon">${w.phon_zhuyin}<small>第一個音</small></div>
        </div>
      </div>
      <div class="rung" data-lv="3">
        <button class="rung-head" data-open="3"><span class="num">3</span>完整示範</button>
        <div class="rung-body" hidden>
          <div class="reveal">${w.zh}</div>
          <button class="bigbtn ghost" id="pPlay">🔊 聽一次，然後跟著說</button>
        </div>
      </div>
    </div>
  </div>`;

  const ladder = view.querySelector("#ladder");

  view.querySelector("#pHelp").onclick = () => {
    ladder.hidden = false;
    view.querySelector("#pHelp").textContent = "還是想不起來？往下一層";
    openRung(Math.min(session.level + 1, 3));
  };

  view.querySelectorAll("[data-open]").forEach(b =>
    b.onclick = () => openRung(Number(b.dataset.open)));

  view.querySelector("#pOK").onclick = () => finishTrial(session.level);

  function openRung(lv){
    session.level = Math.max(session.level, lv);
    view.querySelectorAll(".rung").forEach(r => {
      const n = Number(r.dataset.lv);
      r.querySelector(".rung-body").hidden = n !== lv;
      r.dataset.reached = n <= session.level ? "true" : "false";
    });
    const play = view.querySelector("#pPlay");
    if (play) play.onclick = () => speak(w);
    if (lv === 3) speak(w);
  }
}

function finishTrial(level){
  session.results.push({ id: session.items[session.i], level, at: new Date().toISOString() });
  session.i++; session.level = 0;
  render();
}

function renderSummary(){
  crumb.textContent = "這次練習的結果";
  const names = ["無提示","語意提示","音韻提示","完整示範"];
  const rows = session.results.map(r => {
    const w = byId(r.id);
    return `<div class="sumrow"><span>${w.zh}</span>
      <span class="pill lv${r.level}">${names[r.level]}</span></div>`;
  }).join("");
  const lv0 = session.results.filter(r => r.level === 0).length;

  view.innerHTML = `<div class="summary">
    <p class="ask">${session.results.length} 題中，有 ${lv0} 題不需要提示就說出來了</p>
    ${rows}
    <div style="height:20px"></div>
    <button class="bigbtn ok" id="again">再練一次</button>
    <div style="height:10px"></div>
    <button class="bigbtn ghost" id="other">換一個主題</button>
  </div>`;

  const log = store.get("sessions", []);
  log.push({ cat: session.cat, started: session.started,
             ended: new Date().toISOString(), results: session.results });
  store.set("sessions", log);

  view.querySelector("#again").onclick = () => { startSession(session.cat); render(); };
  view.querySelector("#other").onclick = () => { stack = []; session = null; render(); };
}

/* ============================================================
   6. 模式、返回、設定
   ============================================================ */
document.getElementById("mComm").onclick = () => setMode("comm");
document.getElementById("mPrac").onclick = () => setMode("prac");

function setMode(m){
  mode = m; stack = []; session = null; cartOpen = false;
  document.getElementById("mComm").setAttribute("aria-pressed", m === "comm");
  document.getElementById("mPrac").setAttribute("aria-pressed", m === "prac");
  render();
}

back.onclick = () => {
  if (cartOpen){ cartOpen = false; render(); return; }
  if (mode === "prac" && session && session.i < session.items.length && session.i > 0){
    // 練習進行中往回 = 退出這次練習，不強留使用者
    session = null; stack = [];
  } else {
    stack.pop();
  }
  render();
};

document.getElementById("btnCart").onclick = () => {
  cartOpen = !cartOpen;
  render();
};

const dlg = document.getElementById("dlg");
document.getElementById("btnSet").onclick = () => dlg.showModal();
document.getElementById("btnClose").onclick = () => dlg.close();

document.querySelectorAll(".seg").forEach(seg => {
  seg.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      applySetting(seg.dataset.set, b.dataset.v);
    };
  });
});

function applySetting(key, val){
  if (key === "step") document.documentElement.style.setProperty("--step", val);
  else document.body.dataset[key] = val;
  const s = store.get("settings", {}); s[key] = val; store.set("settings", s);
}

(function restore(){
  const s = store.get("settings", {});
  Object.entries(s).forEach(([k,v]) => {
    applySetting(k, v);
    const seg = document.querySelector(`.seg[data-set="${k}"]`);
    if (!seg) return;
    seg.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  });
})();

document.getElementById("btnTest").onclick = () => {
  unlock();
  const info = document.getElementById("voiceInfo");
  const v = pickVoice();
  const n = ("speechSynthesis" in window) ? (speechSynthesis.getVoices() || []).length : 0;
  if (!("speechSynthesis" in window)){
    info.textContent = "這個瀏覽器不支援語音合成，請改用 Chrome 或 Safari。";
  } else if (v){
    info.textContent = `使用語音：${v.name}（${v.lang}）`;
    tts({ zh:"你好，這是語音測試" });
  } else if (n === 0){
    info.textContent = "尚未載入任何語音，請等一下再按一次。";
  } else {
    info.textContent = "這台裝置沒有中文語音。Android 請到「設定 → 系統 → 語言與輸入 → 文字轉語音」安裝中文語音資料；iPhone 請到「設定 → 輔助使用 → 朗讀內容 → 語音」加入中文。";
  }
};

document.getElementById("btnExport").onclick = () => {
  const data = JSON.stringify({ exported:new Date().toISOString(),
                                sessions: store.get("sessions", []) }, null, 2);
  const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = `aphasia-practice-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
};

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

loadConfig().then(() => setMode("comm"));
</script>
